<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Joel Harvey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Joel Harvey — projects and research.">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #22303c;
      color: #d8e0e7;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    main { max-width: 560px; width: 100%; }
    h1 { color: #fff; font-size: 2rem; margin: 0 0 0.3rem; }
    .tagline { color: #8fa3b3; margin: 0 0 2rem; }
    .links { display: flex; flex-direction: column; gap: 0.8rem; }
    .links a {
      display: block;
      background: #33465a;
      border-radius: 10px;
      padding: 0.9rem 1.2rem;
      color: #fff;
      text-decoration: none;
      transition: background 0.15s;
    }
    .links a:hover { background: #3d5570; }
    .links a span { display: block; color: #8fa3b3; font-size: 0.85rem; margin-top: 0.15rem; }
    footer { margin-top: 2.5rem; font-size: 0.8rem; color: #6b7d8c; }
    footer a { color: #8fa3b3; }
  </style>
</head>
<body>
  <main>
    <h1>Joel Harvey</h1>
    <p class="tagline">Projects &amp; research.</p>

    <div class="links">
      <a href="https://research.joelmharvey.com">
        🧠 Research Hub
        <span>Men's mental health research library — collect, read, cite, ask.</span>
      </a>
      <a href="https://github.com/JoelMHarvey">
        💻 GitHub
        <span>Code and works in progress.</span>
      </a>
      <a href="mailto:joelharvey@me.com">
        📧 Contact
        <span>joelharvey@me.com</span>
      </a>
    </div>

    <footer>
      <a href="/lostphone/">📱 Found my phone?</a>
    </footer>
  </main>
</body>
</html>
